[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheia-ai"
version = "0.2.0"
description = "An experimental Reflective Intelligence architecture for epistemic clarity, self-understanding, and autonomous human choice."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Aletheia AI Contributors" },
]
keywords = [
    "reflective-intelligence",
    "epistemology",
    "wisdom-graph",
    "socratic-ai",
    "ai-alignment",
    "self-understanding",
    "philosophy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Philosophy",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.16",
    "rich>=13.7",
    "click>=8.1",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "tenacity>=8.2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
ollama = ["ollama>=0.2"]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.2"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "respx>=0.21",
]
all = ["aletheia-ai[ollama,openai,anthropic,postgres,dev]"]

[project.urls]
Homepage = "https://github.com/aletheia-ai/aletheia-ai"
Documentation = "https://github.com/aletheia-ai/aletheia-ai/tree/main/docs"
Issues = "https://github.com/aletheia-ai/aletheia-ai/issues"

[project.scripts]
aletheia = "aletheia.cli.app:main"
aletheia-server = "aletheia.api.server:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aletheia = ["py.typed", "data/*.json", "data/*.jsonl"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require external services (e.g. Ollama)",
    "slow: marks tests that are slow to run",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",              # isort
    "B",              # bugbear
    "UP",             # pyupgrade
    "SIM",            # simplify
    "RUF",            # ruff-specific
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src/aletheia"]
